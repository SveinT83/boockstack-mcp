# Review only. Replace example host and TLS paths; do not apply to an existing proxy automatically.
server {
    listen 443 ssl;
    server_name bookstack-mcp.example.org;
    ssl_certificate /etc/ssl/REPLACE/fullchain.pem;
    ssl_certificate_key /etc/ssl/REPLACE/privkey.pem;
    client_max_body_size 600k;
    # No access log: OAuth callback query strings contain temporary authorization codes.
    # Use application correlation logs or a separately reviewed log_format using $uri, never $request/$args.
    access_log off;
    error_log /var/log/nginx/bookstack-mcp-error.log crit;
    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
